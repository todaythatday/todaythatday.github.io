<!doctype html>
<html lang="{{ site.lang | default: 'ko-KR' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#FCFDFC">
  <title>{{ page.title }} · {{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="apple-touch-icon" href="{{ '/assets/img/icon-180.png' | relative_url }}">
  <link rel="icon" type="image/png" href="{{ '/assets/img/icon-64.png' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}?v={{ site.time | date: '%s' }}">
</head>
<body>
  <div class="page">
    <header class="app-header">
      <a class="logo" href="{{ '/' | relative_url }}"><img src="{{ '/assets/img/logo.svg' | relative_url }}" width="363" height="100" alt="오늘, 그날"></a>
    </header>
    <div class="heading">
      <p class="eyebrow">{{ page.eyebrow }}</p>
      <h1 class="hand"><img src="{{ page.hand | relative_url }}" width="{{ page.hand_w }}" height="100" alt="{{ page.hand_text }}"></h1>
    </div>
    <main>
{{ content }}
    </main>
    <footer class="footer">
      <nav><a href="{{ '/' | relative_url }}">도움말과 문의</a><span aria-hidden="true"> · </span><a href="{{ '/privacy.html' | relative_url }}">개인정보 처리방침</a></nav>
      <p>© 2026 오늘, 그날</p>
    </footer>
  </div>
</body>
</html>
